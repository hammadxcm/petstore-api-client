# Petstore API Client - CI/CD Pipeline
# Author: Hammad Khan (@hammadxcm)
# Repository: https://github.com/hammadxcm/petstore-api-client

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3']

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 💎 Set up Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: 📦 Install dependencies
      run: bundle install --jobs 4 --retry 3

    - name: 🧪 Run tests
      run: bundle exec rspec

    - name: 📊 Upload coverage (Ruby 3.3 only)
      if: matrix.ruby == '3.3'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: coverage/

  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: 📦 Install dependencies
      run: bundle install --jobs 4 --retry 3

    - name: 🔍 Run RuboCop
      run: bundle exec rubocop

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: 🔒 Run bundle audit
      run: |
        gem install bundler-audit
        bundle audit check --update

  build:
    name: Build Gem
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: 📦 Build gem
      run: gem build petstore_api_client.gemspec

    - name: 📤 Upload gem artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: petstore-api-client-gem
        path: '*.gem'

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 💎 Set up Ruby
      uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: 📦 Install dependencies
      run: bundle install

    - name: 🧪 Run tests with coverage
      run: bundle exec rspec

    - name: 📊 Check coverage threshold
      run: |
        COVERAGE=$(ruby -e "require 'json'; data = JSON.parse(File.read('coverage/.last_run.json')); puts data['result']['line']")
        echo "Coverage: $COVERAGE%"
        if (( $(echo "$COVERAGE < 95" | bc -l) )); then
          echo "❌ Coverage $COVERAGE% is below 95% threshold"
          exit 1
        fi
        echo "✅ Coverage $COVERAGE% meets threshold"

  report:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security, build, coverage]
    if: always()

    steps:
    - name: 📋 Generate summary
      run: |
        {
          echo "## 🎯 CI/CD Pipeline Results"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| Linting | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| Security | ${{ needs.security.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
          echo "| Coverage | ${{ needs.coverage.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
        } >> "$GITHUB_STEP_SUMMARY"
